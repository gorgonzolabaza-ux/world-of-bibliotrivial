<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ingesta de exámenes · World of BiblioTrivial</title>
    <style>
      :root {
        --gold: #f5c518;
        --paper: #f2ead5;
        --panel: rgba(20, 16, 12, 0.92);
        --line: rgba(245, 197, 24, 0.18);
        --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        --sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; padding: 32px 20px 64px;
        background: radial-gradient(circle at 50% 0%, #14332c 0%, #0b0f0d 60%, #070908 100%);
        color: var(--paper); font-family: var(--sans);
      }
      .wrap { max-width: 900px; margin: 0 auto; }
      h1 {
        font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: 0.05em;
        text-transform: uppercase; color: var(--gold); margin: 0 0 6px;
      }
      .sub { color: rgba(242, 234, 213, 0.55); font-size: 13px; margin: 0 0 26px; }
      section {
        background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
        padding: 22px; margin-bottom: 18px;
        box-shadow: 0 20px 50px -30px #000;
      }
      section h2 {
        font-family: var(--serif); font-size: 15px; font-weight: 600; letter-spacing: 0.04em;
        text-transform: uppercase; color: var(--gold); margin: 0 0 14px;
      }
      p { line-height: 1.55; font-size: 14px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
      label { display: block; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(242, 234, 213, 0.6); }
      input, select {
        width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 9px;
        border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(0, 0, 0, 0.35);
        color: var(--paper); font-family: var(--sans); font-size: 14px;
      }
      input[type='file'] { padding: 8px; font-size: 12.5px; }
      input:focus, select:focus { outline: 2px solid rgba(245, 197, 24, 0.45); outline-offset: 1px; }
      button {
        margin-top: 16px; padding: 12px 20px; border-radius: 10px; cursor: pointer;
        border: 1px solid rgba(245, 197, 24, 0.4);
        background: linear-gradient(180deg, #f5c518, #d9a90f);
        color: #241a05; font-family: var(--sans); font-size: 14px; font-weight: 600;
      }
      button.secondary { background: rgba(255, 255, 255, 0.06); color: var(--paper); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .msg { margin-top: 12px; font-size: 13.5px; min-height: 18px; }
      .msg.error { color: #ff8b7a; }
      .msg.ok { color: #6ee7a8; }
      .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
      .chip {
        padding: 7px 12px; border-radius: 999px; font-size: 12.5px;
        background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .chip b { color: var(--gold); }
      table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 12.5px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); vertical-align: top; }
      th { color: rgba(242, 234, 213, 0.55); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
      td.num { color: rgba(242, 234, 213, 0.45); width: 42px; }
      td.cat { white-space: nowrap; color: var(--gold); font-size: 11.5px; }
      td.ans { width: 46px; color: #6ee7a8; font-weight: 600; }
      .warn { margin-top: 14px; font-size: 12.5px; color: #ffc978; }
      .warn ul { margin: 6px 0 0; padding-left: 20px; }
      a { color: var(--gold); }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Ingesta de exámenes</h1>
      <p class="sub">
        Sube el examen y la plantilla de respuestas. Se convierten en tarjetas y se publican en el juego.
        Los PDF no salen de tu equipo: el texto se extrae en el navegador.
      </p>

      <!-- 1 · contraseña -->
      <section id="gate">
        <h2>Acceso</h2>
        <label for="password">Contraseña de ingesta</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        <button id="enter">Entrar</button>
        <p id="gateMsg" class="msg"></p>
      </section>

      <!-- 2 · subida -->
      <section id="panel" class="hidden">
        <h2>Examen y respuestas</h2>
        <div class="grid">
          <label>Examen (PDF) <input id="exam" type="file" accept=".pdf,application/pdf" /></label>
          <label>Respuestas (PDF) <input id="answers" type="file" accept=".pdf,application/pdf" /></label>
        </div>
        <div class="grid" style="margin-top: 14px">
          <label>Identificador <input id="examId" placeholder="examen2-2025" /></label>
          <label>Dificultad
            <select id="difficulty">
              <option value="normal">Normal (C1/C2)</option>
              <option value="hard">Difícil (A1/A2)</option>
            </select>
          </label>
          <label>Año <input id="year" type="number" min="1900" max="2100" placeholder="2025" /></label>
        </div>
        <button id="process">Procesar PDFs</button>
        <p id="processMsg" class="msg"></p>

        <div id="review" class="hidden">
          <div id="stats" class="stats"></div>
          <div id="warnings" class="warn"></div>
          <table>
            <thead>
              <tr><th>#</th><th>Pregunta</th><th>Correcta</th><th>Categoría</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <button id="publish">Publicar en el trivial</button>
          <p id="publishMsg" class="msg"></p>
        </div>
      </section>
    </div>
    <script type="module" src="./src/ingest.ts"></script>
  </body>
</html>
